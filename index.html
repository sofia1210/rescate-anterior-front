<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rescate Animales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link rel="icon" type="image/png" href="/imagenes/patita.png" />
    <link rel="shortcut icon" href="/imagenes/patita.png" />
    <link href="tailwind.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
      /* Estilos personalizados para marcadores de rescate */
      .custom-rescue-marker {
        background: transparent !important;
        border: none !important;
      }
      
      /* Ocultar controles de routing no deseados */
      .leaflet-routing-container {
        display: none !important;
      }
      
      /* Estilos para la ruta */
      .leaflet-routing-line {
        stroke: #16a34a !important;
        stroke-width: 4px !important;
        stroke-opacity: 0.8 !important;
      }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
